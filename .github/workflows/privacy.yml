jobs:
  privacy:
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
      name: Check out every historical ref
    - run: pwsh -NoProfile -NonInteractive -File scripts/Install-PrivacyTools.ps1
      shell: pwsh
      name: Install verified scanner and fixture runner
    - run: pwsh -NoProfile -NonInteractive -File scripts/Run-PrivacyTests.ps1
      shell: pwsh
      name: Check native scanner rules and export boundaries
    - run: pwsh -NoProfile -NonInteractive -File scripts/Invoke-PrivacyCheck.ps1
      shell: pwsh
      name: Scan all history, working tree and nested archives
    - run: pwsh -NoProfile -NonInteractive -File scripts/Test-PublishedEvidenceManifest.ps1
      shell: pwsh
      name: Verify current evidence manifest bindings
    runs-on: ubuntu-latest
"on":
  pull_request: 
  workflow_dispatch: 
  push: 
name: Public evidence privacy
permissions:
  contents: read

