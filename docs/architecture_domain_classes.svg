<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><style>.bg{fill:#f8fafc}.c{fill:#fff;stroke:#344861;stroke-width:2;rx:12}.a{fill:#eaf2ff;stroke:#3568a8;stroke-width:2;rx:12}.v{fill:#f4edff;stroke:#7654a2;stroke-width:2;rx:12}.t{font:700 18px Arial;fill:#17283e}.s{font:14px Arial;fill:#33445c}.h{font:700 25px Arial;fill:#17283e}.l{stroke:#53677f;stroke-width:2;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#53677f"/></marker></defs><rect class="bg" width="1200" height="760"/><text x="600" y="40" class="h" text-anchor="middle">Domain model: aggregate roots, entities, values, and policies</text>
<rect class="a" x="55" y="90" width="500" height="260"/><text class="t" x="305" y="123" text-anchor="middle">Room aggregate root</text><text class="s" x="80" y="160">Room</text><text class="s" x="80" y="187">capacity · phase · version · deadline</text><rect class="c" x="85" y="220" width="190" height="95"/><text class="t" x="180" y="250" text-anchor="middle">PlayerSeat</text><text class="s" x="105" y="278">PlayerId · seat order</text><rect class="c" x="315" y="220" width="205" height="95"/><text class="t" x="418" y="250" text-anchor="middle">Observer</text><text class="s" x="335" y="278">ObserverId · followed player</text>
<rect class="a" x="645" y="90" width="500" height="260"/><text class="t" x="895" y="123" text-anchor="middle">Match / Round aggregate</text><text class="s" x="670" y="160">Match</text><text class="s" x="670" y="187">RosterSnapshot · anchor · standings · state</text><rect class="c" x="675" y="220" width="200" height="95"/><text class="t" x="775" y="250" text-anchor="middle">Round</text><text class="s" x="695" y="278">prompt · hint stage · status</text><rect class="c" x="910" y="220" width="205" height="95"/><text class="t" x="1012" y="250" text-anchor="middle">SolveRecord</text><text class="s" x="930" y="278">PlayerId · points · elapsed</text>
<rect class="v" x="55" y="420" width="250" height="110"/><text class="t" x="180" y="453" text-anchor="middle">Value objects</text><text class="s" x="75" y="485">RoomCode · RoomCapacity</text><text class="s" x="75" y="508">PlayerId · AggregateVersion</text>
<rect class="v" x="350" y="420" width="250" height="110"/><text class="t" x="475" y="453" text-anchor="middle">Catalog values</text><text class="s" x="370" y="485">Category · WordPair</text><text class="s" x="370" y="508">HintSet · AcceptedAnswerSet</text>
<rect class="v" x="645" y="420" width="250" height="110"/><text class="t" x="770" y="453" text-anchor="middle">Gameplay values</text><text class="s" x="665" y="485">HintStage · ScoreAward</text><text class="s" x="665" y="508">ElapsedTime · AcceptanceSequence</text>
<rect class="v" x="940" y="420" width="205" height="110"/><text class="t" x="1042" y="453" text-anchor="middle">Identity values</text><text class="s" x="960" y="485">PlayerProfile · IconId</text><text class="s" x="960" y="508">GuestIdentity / OIDC subject</text>
<rect class="c" x="80" y="600" width="1040" height="110"/><text class="t" x="600" y="635" text-anchor="middle">Injected domain policies (pure functions over domain values)</text><text class="s" x="110" y="675">SeatAssignmentPolicy · ObserverPromotionPolicy · ReadinessPolicy · RoundProgressionPolicy · AnswerMatchingPolicy · ScoringPolicy · AnchorAssignmentPolicy · Standing/TiebreakPolicy · CatalogApprovalPolicy</text>
