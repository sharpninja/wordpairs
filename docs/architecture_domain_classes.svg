<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020">
<defs><style>.bg{fill:#f8fafc}.ctx{fill:#eaf2ff;stroke:#3568a8;stroke-width:2;rx:14}.box{fill:#fff;stroke:#344861;stroke-width:1.7;rx:9}.p{fill:#f4edff;stroke:#7654a2;stroke-width:1.7;rx:9}.infra{fill:#edf8f0;stroke:#378453;stroke-width:2;rx:12}.h{font:700 27px Arial;fill:#17283e}.ct{font:700 19px Arial;fill:#17283e}.cl{font:700 15px Arial;fill:#20344d}.tx{font:13px Arial;fill:#33445c}.small{font:12px Arial;fill:#43556b}.line{stroke:#53677f;stroke-width:1.7;fill:none;marker-end:url(#m)}.dash{stroke-dasharray:6 5}</style><marker id="m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#53677f"/></marker></defs>
<rect class="bg" width="1400" height="1020"/><text x="700" y="42" class="h" text-anchor="middle">Wordpairs domain class map: aggregate roots, domain classes, policies, and ports</text>
<!-- Identity -->
<rect class="ctx" x="35" y="80" width="400" height="260"/><text class="ct" x="235" y="113" text-anchor="middle">Identity &amp; Profile</text>
<rect class="box" x="60" y="135" width="165" height="74"/><text class="cl" x="142" y="160" text-anchor="middle">PlayerProfile</text><text class="small" x="72" y="184">PlayerId · IconId · public label</text>
<rect class="box" x="245" y="135" width="165" height="74"/><text class="cl" x="327" y="160" text-anchor="middle">GuestIdentity</text><text class="small" x="258" y="184">session · persistence policy</text>
<rect class="p" x="60" y="235" width="350" height="76"/><text class="cl" x="235" y="260" text-anchor="middle">IdentityVerifierPort / OidcVerifier</text><text class="small" x="74" y="285">verified issuer + subject → PlayerId; provider adapter isolated</text>
<!-- Room -->
<rect class="ctx" x="500" y="80" width="400" height="260"/><text class="ct" x="700" y="113" text-anchor="middle">Room &amp; Lobby</text>
<rect class="box" x="525" y="135" width="350" height="66"/><text class="cl" x="700" y="160" text-anchor="middle">Room aggregate root</text><text class="small" x="540" y="184">capacity · phase · version · deadlines · ordered roster</text>
<rect class="box" x="525" y="220" width="165" height="82"/><text class="cl" x="607" y="247" text-anchor="middle">PlayerSeat</text><text class="small" x="540" y="272">PlayerId · ready · position</text>
<rect class="box" x="710" y="220" width="165" height="82"/><text class="cl" x="792" y="247" text-anchor="middle">Observer</text><text class="small" x="725" y="272">inviter · arrival order</text>
<!-- Gameplay -->
<rect class="ctx" x="965" y="80" width="400" height="260"/><text class="ct" x="1165" y="113" text-anchor="middle">Gameplay</text>
<rect class="box" x="990" y="135" width="350" height="66"/><text class="cl" x="1165" y="160" text-anchor="middle">Match aggregate root</text><text class="small" x="1005" y="184">RosterSnapshot · anchor · score · completion</text>
<rect class="box" x="990" y="220" width="165" height="82"/><text class="cl" x="1072" y="247" text-anchor="middle">Round</text><text class="small" x="1005" y="272">stage · content version · state</text>
<rect class="box" x="1175" y="220" width="165" height="82"/><text class="cl" x="1257" y="247" text-anchor="middle">Submission / SolveRecord</text><text class="small" x="1190" y="272">acceptedAt · score · elapsed</text>
<!-- Content -->
<rect class="ctx" x="120" y="405" width="560" height="300"/><text class="ct" x="400" y="438" text-anchor="middle">Content &amp; Moderation</text>
<rect class="box" x="145" y="460" width="240" height="82"/><text class="cl" x="265" y="488" text-anchor="middle">Category / WordPair</text><text class="small" x="160" y="515">Prompt · target · hints · accepted answers</text>
<rect class="box" x="405" y="460" width="240" height="82"/><text class="cl" x="525" y="488" text-anchor="middle">CatalogVersion</text><text class="small" x="420" y="515">approved, complete, immutable match input</text>
<rect class="box" x="145" y="565" width="240" height="82"/><text class="cl" x="265" y="593" text-anchor="middle">CandidateNomination</text><text class="small" x="160" y="620">normalized candidate · nominator · time</text>
<rect class="box" x="405" y="565" width="240" height="82"/><text class="cl" x="525" y="593" text-anchor="middle">CategorySuggestion</text><text class="small" x="420" y="620">category + three proposed pairs</text>
<rect class="p" x="145" y="665" width="500" height="26"/><text class="small" x="395" y="683" text-anchor="middle">ModerationCase · CatalogApprovalPolicy · PlayableContentValidator</text>
<!-- Read models -->
<rect class="ctx" x="760" y="405" width="560" height="300"/><text class="ct" x="1040" y="438" text-anchor="middle">Read Models &amp; Room Events</text>
<rect class="box" x="785" y="460" width="240" height="82"/><text class="cl" x="905" y="488" text-anchor="middle">LandingPageProjection</text><text class="small" x="800" y="515">Leaderboard · public lobby · rules allowlist</text>
<rect class="box" x="1045" y="460" width="240" height="82"/><text class="cl" x="1165" y="488" text-anchor="middle">RoundScorecardProjection</text><text class="small" x="1060" y="515">audience-specific, target/guess-safe DTO</text>
<rect class="box" x="785" y="565" width="240" height="82"/><text class="cl" x="905" y="593" text-anchor="middle">EmojiReaction</text><text class="small" x="800" y="620">allowlisted, informational room event</text>
<rect class="box" x="1045" y="565" width="240" height="82"/><text class="cl" x="1165" y="593" text-anchor="middle">ObserverProjectionPolicy</text><text class="small" x="1060" y="620">follows inviter permissions, read only</text>
<rect class="p" x="785" y="665" width="500" height="26"/><text class="small" x="1035" y="683" text-anchor="middle">PublicFieldAllowlist · AuthorizedViewMapper · RoomEventPort</text>
<!-- Policies/ports -->
<rect class="infra" x="80" y="775" width="1240" height="180"/><text class="ct" x="700" y="812" text-anchor="middle">Pure policies and injected infrastructure ports</text>
<rect class="p" x="105" y="835" width="390" height="85"/><text class="cl" x="300" y="863" text-anchor="middle">Domain policies</text><text class="small" x="125" y="890">SeatAssignment · Promotion · Readiness · AnswerMatching</text><text class="small" x="125" y="909">Scoring · Anchor · Standing/Tiebreak · Moderation</text>
<rect class="p" x="520" y="835" width="340" height="85"/><text class="cl" x="690" y="863" text-anchor="middle">Injected deterministic ports</text><text class="small" x="540" y="890">Clock · RandomSource · DeadlineScheduler</text><text class="small" x="540" y="909">IdentityVerifier · ContentCatalog</text>
<rect class="p" x="885" y="835" width="410" height="85"/><text class="cl" x="1090" y="863" text-anchor="middle">Persistence / delivery ports</text><text class="small" x="905" y="890">RoomRepository · MatchRepository · ModerationRepository</text><text class="small" x="905" y="909">IdempotencyStore · OutboxRepository · transaction runner</text>
<text class="small" x="700" y="988" text-anchor="middle">Relations: stable PlayerId links contexts; Match snapshots Room roster and CatalogVersion; projections are read-only and audience-filtered.</text>
<path class="line" d="M435 210L545 240M900 160H990M680 500H760M900 500H1045M700 340V375H400V405M1165 340V375H1040V405"/>
<path class="line dash" d="M700 705V775M400 705V775M1040 705V775"/>
</svg>