<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#344861;stroke-width:2;rx:12}.a{fill:#eaf2ff;stroke:#3568a8;stroke-width:2;rx:12}.p{fill:#edf8f0;stroke:#378453;stroke-width:2;rx:12}.t{font:700 18px Arial;fill:#17283e}.s{font:14px Arial;fill:#33445c}.h{font:700 25px Arial;fill:#17283e}.l{stroke:#53677f;stroke-width:2;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#53677f"/></marker></defs><rect class="bg" width="1200" height="720"/><text x="600" y="40" class="h" text-anchor="middle">Concurrency-safe command and transactional outbox patterns</text>
<rect class="b" x="45" y="95" width="215" height="95"/><text class="t" x="152" y="128" text-anchor="middle">Route / transport</text><text class="s" x="65" y="158">auth · parse · command ID</text>
<rect class="a" x="325" y="95" width="240" height="95"/><text class="t" x="445" y="128" text-anchor="middle">CommandHandler</text><text class="s" x="345" y="158">JoinRoom / MarkReady / Submit</text>
<rect class="a" x="630" y="95" width="230" height="95"/><text class="t" x="745" y="128" text-anchor="middle">TransactionRunner</text><text class="s" x="650" y="158">begin · lock · commit/rollback</text>
<rect class="p" x="925" y="95" width="230" height="95"/><text class="t" x="1040" y="128" text-anchor="middle">RoomRepository</text><text class="s" x="945" y="158">load current aggregate version</text>
<path class="l" d="M260 142H325M565 142H630M860 142H925"/>
<rect class="b" x="80" y="285" width="250" height="110"/><text class="t" x="205" y="320" text-anchor="middle">IdempotencyStore</text><text class="s" x="100" y="351">commandId → canonical result</text><text class="s" x="100" y="375">same-transaction write</text>
<rect class="a" x="390" y="285" width="250" height="110"/><text class="t" x="515" y="320" text-anchor="middle">Domain aggregate + policy</text><text class="s" x="410" y="351">reload · decide · enforce invariant</text><text class="s" x="410" y="375">expected aggregate version</text>
<rect class="p" x="700" y="285" width="220" height="110"/><text class="t" x="810" y="320" text-anchor="middle">OutboxRepository</text><text class="s" x="720" y="351">persist event before commit</text><text class="s" x="720" y="375">eventId · aggregate version</text>
<rect class="b" x="980" y="285" width="180" height="110"/><text class="t" x="1070" y="320" text-anchor="middle">Publisher</text><text class="s" x="998" y="351">retry after commit</text><text class="s" x="998" y="375">dedupe by eventId</text>
<path class="l" d="M1040 190V240H515V285M745 190V235H810V285M330 340H390M640 340H700M920 340H980"/>
<rect class="b" x="180" y="500" width="360" height="125"/><text class="t" x="360" y="535" text-anchor="middle">Database transaction</text><text class="s" x="205" y="568">row lock / compare-and-swap · constraints</text><text class="s" x="205" y="592">aggregate + idempotency + outbox commit atomically</text>
<rect class="b" x="660" y="500" width="360" height="125"/><text class="t" x="840" y="535" text-anchor="middle">Versioned DeadlineScheduler</text><text class="s" x="685" y="568">deadline + expected aggregate version</text><text class="s" x="685" y="592">stale callback rechecks and no-ops</text>
<path class="l" d="M515 395V455H360V500M810 395V455H840V500"/><text class="s" x="600" y="675" text-anchor="middle">Publish only committed, audience-filtered projections; delivery retry never reapplies the domain command.</text></svg>